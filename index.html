<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Habesha Stream — Free, legal movies with no ads</title>
  <meta name="description" content="Habesha Stream: stream classic movies, cartoons and documentaries free, legally and without ads." />
  <meta name="theme-color" content="#0f1117" />
  <link rel="icon" href="/assets/logo.svg" type="image/svg+xml" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Noto+Sans+Ethiopic:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/styles.css" />
</head>
<body>
  <header class="topbar" id="topbar">
    <a href="#/" class="brand" aria-label="Habesha Stream home">
      <img src="/assets/logo.svg" alt="" width="40" height="40" />
      <span class="brand-text">Habesha<b>Stream</b></span>
    </a>
    <nav class="topnav" id="topnav"></nav>
    <div class="top-actions">
      <button class="icon-btn" id="searchBtn" aria-label="Search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      </button>
    </div>
  </header>

  <main id="app" tabindex="-1"></main>

  <nav class="bottomnav" id="bottomnav"></nav>

  <div class="search-overlay" id="searchOverlay" hidden>
    <div class="search-bar">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="searchInput" type="search" autocomplete="off" />
      <button class="icon-btn" id="searchClose" aria-label="Close search">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="search-results" id="searchResults"></div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="/assets/app.js" type="module"></script>
</body>
</html>
