[build]
  publish = "."

[[headers]]
  for = "/assets/data/*"
  [headers.values]
    Cache-Control = "public, max-age=300"

# Keep the Android update manifests fresh for the app's update checker
[[headers]]
  for = "/app-release*.json"
  [headers.values]
    Cache-Control = "no-cache"
    Access-Control-Allow-Origin = "*"
